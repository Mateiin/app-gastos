<div class="app-layout" [class.sidebar-open]="sidebarOpen">
  <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="sidebarOpen ? 'Cerrar menú' : 'Abrir menú'">
    {{ sidebarOpen ? '✕' : '☰' }}
  </button>

  @if (sidebarOpen) {
    <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
  }

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <span class="logo-dot"></span>
      </div>
      <span class="brand-name">Finanzas</span>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section">Menú</span>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="sidebarOpen = false">
        <span class="nav-icon" aria-hidden="true">▦</span>
        Resumen
      </a>
      <a routerLink="/gastos" routerLinkActive="active" (click)="sidebarOpen = false">
        <span class="nav-icon" aria-hidden="true">▬</span>
        Gastos
      </a>
      <a routerLink="/ingresos" routerLinkActive="active" (click)="sidebarOpen = false">
        <span class="nav-icon" aria-hidden="true">▲</span>
        Ingresos
      </a>
      <a routerLink="/ahorros" routerLinkActive="active" (click)="sidebarOpen = false">
        <span class="nav-icon" aria-hidden="true">◈</span>
        Cuentas
      </a>
    </nav>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <h1 class="topbar-title">Panel financiero</h1>
    </header>
    <main class="app-main">
      <router-outlet />
    </main>
  </div>
</div>
